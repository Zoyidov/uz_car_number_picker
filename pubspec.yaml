name: uz_car_number_picker
description: "A highly customizable Uzbekistan car plate number picker with Glassmorphism, localization (UZ, RU, EN), and physical/legal entity support."
version: 1.0.2
homepage: https://github.com/zoyidov/uz_car_number_picker
repository: https://github.com/zoyidov/uz_car_number_picker
issue_tracker: https://github.com/zoyidov/uz_car_number_picker/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  glassmorphism: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

